name: Feature request
description: Suggest an improvement to the Files page
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        PitExplorer is a file browser only. It has no backend of its own and runs
        everything through Cockpit with the rights of the logged-in user.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Does this need more privileges, new commands, or access to other paths?
